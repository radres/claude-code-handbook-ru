name: Cheatsheet → GitHub Pages

# Публикует шпаргалку на https://sfrangulov.github.io/claude-code-handbook-ru/
# Это ссылка в поле Website репозитория. На сайт уходят только index.html,
# PDF и картинка-превью: README и исходник карточки там не нужны.

on:
  push:
    branches: [main]
    paths:
      - 'cheatsheet/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect site
        run: |
          mkdir _site
          cp cheatsheet/index.html cheatsheet/cheatsheet.pdf cheatsheet/og.png _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
